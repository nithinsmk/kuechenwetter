<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Küchenwetter label</title>
  <style>
    @page { size: A4; margin: 15mm; }

    :root { --ink: #1a1a1a; --muted: #6b6b68; --font: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 24px 16px;
      background: #e4e4e2;
      color: var(--ink);
      font: 10pt/1.4 var(--font);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .hint { color: var(--muted); max-width: 70mm; text-align: center; }

    /* The label, at its real printed size. The dashed line is where to cut. */
    .label {
      position: relative;
      width: 78mm;
      padding: 10mm 11mm 9mm;
      background: #fff;
      outline: 0.3mm dashed var(--muted);
      outline-offset: 1.5mm;
      display: flex;
      flex-direction: column;
      gap: 3mm;
    }

    /* The border: a pixel band of blue tiles with evil-eye beads, drawn by the script below. */
    .label .border { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; }
    .label > :not(.border) { position: relative; }
    .label h1 { margin: 0; font-size: 13pt; letter-spacing: 0.02em; }
    .label .wip { margin: 0; text-transform: uppercase; letter-spacing: 0.12em; font-size: 8pt; }
    .label .qr { width: 100%; display: block; image-rendering: pixelated; }
    /* Salvia sits on the top edge of the code, in its white margin, clear of the squares. */
    .label .top { position: relative; display: flex; justify-content: space-between; align-items: flex-end; }
    .label .salvia { width: 22mm; image-rendering: pixelated; margin: 0 1mm -4.5mm 0; position: relative; z-index: 1; }
    .label p { margin: 0; }
    .label .small { color: var(--muted); font-size: 8pt; }

    @media print {
      body { background: none; padding: 0; }
      .hint { display: none; }
    }
  </style>
</head>
<body>
  <p class="hint">Print at 100% (no "fit to page"), cut along the dashed line, and stick it on the fridge.</p>

  <div class="label">
    <canvas class="border" aria-hidden="true"></canvas>
    <div class="top">
      <div>
        <h1>Küchenwetter</h1>
        <p class="wip">work in progress</p>
      </div>
      <canvas class="salvia" id="salvia" aria-label="Salvia, in pixels, with her hamsa collar"></canvas>
    </div>
    <img class="qr" src="qr.svg" alt="QR code for the Küchenwetter radio">
    <p>a radio for this kitchen,<br>and the wheel turns here.<br>scan to tune in.</p>
    <p class="small"><span lang="ar">نظيفة</span>, 2026–</p>
  </div>
  <script type="module">
    // Salvia as she is on the radio: the 8-bit Persian, sitting, from pixelcat.js.
    import { catFrames, frameCanvas } from './pixelcat.js';
    const art = frameCanvas(catFrames().frames.sit.rows);
    const c = document.getElementById('salvia');
    c.width = art.width * 8;
    c.height = art.height * 8;
    const g = c.getContext('2d');
    g.imageSmoothingEnabled = false;
    g.drawImage(art, 0, 0, c.width, c.height);

    // The border, in cells of half a millimetre: a band 10 cells deep of blue tiles (a chain of
    // diamonds between two dark lines), with a nazar bead at each corner and every ~2 cm.
    const label = document.querySelector('.label');
    await document.querySelector('.qr').decode().catch(() => {});
    const MM = 96 / 25.4;
    const W = Math.round(label.offsetWidth / (MM * 0.5));
    const H = Math.round(label.offsetHeight / (MM * 0.5));
    label.style.width = `${W * 0.5}mm`;
    label.style.height = `${H * 0.5}mm`;
    const B = 10;
    const INK = { n: '#1d3a8a', b: '#2f6fd0', l: '#9cc8ef', w: '#ffffff', k: '#111111' };
    const border = label.querySelector('.border');
    border.width = W;
    border.height = H;
    const ctx = border.getContext('2d');
    const dot = (x, y, colour) => { ctx.fillStyle = INK[colour]; ctx.fillRect(x, y, 1, 1); };
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      let u; let v;
      if (y < B) [u, v] = [x, y]; else if (y >= H - B) [u, v] = [x, H - 1 - y];
      else if (x < B) [u, v] = [y, x]; else if (x >= W - B) [u, v] = [y, W - 1 - x];
      else continue;
      if (v === 0 || v === B - 1) { dot(x, y, 'n'); continue; }
      const d = Math.abs((u % 10) - 4.5) + Math.abs(v - 4.5);
      dot(x, y, d < 1.5 ? 'n' : d < 2.5 ? 'w' : d < 3.5 ? 'l' : 'b');
    }
    // the beads: dark blue, white, light blue, a black pupil
    const bead = (cx, cy) => {
      for (let y = -6; y <= 6; y++) for (let x = -6; x <= 6; x++) {
        const r = Math.hypot(x, y);
        if (r > 5.6) continue;
        dot(Math.round(cx + x), Math.round(cy + y), r > 4.4 ? 'n' : r > 3.2 ? 'w' : r > 1.8 ? 'l' : 'k');
      }
      dot(Math.round(cx - 1), Math.round(cy - 1), 'w'); // a glint
    };
    const c0 = (B - 1) / 2;
    const along = (from, to, fixed, horizontal) => {
      const n = Math.max(1, Math.round((to - from) / 40));
      for (let i = 0; i <= n; i++) {
        const t = from + ((to - from) * i) / n;
        horizontal ? bead(t, fixed) : bead(fixed, t);
      }
    };
    along(c0, W - 1 - c0, c0, true);
    along(c0, W - 1 - c0, H - 1 - c0, true);
    along(c0, H - 1 - c0, c0, false);
    along(c0, H - 1 - c0, W - 1 - c0, false);
  </script>
</body>
</html>
